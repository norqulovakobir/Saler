<!DOCTYPE html>
<html lang="uz">
<head>
  <!-- `flutter build web --base-href` shu qiymatni almashtiradi -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport tegini Flutter Web o'zi qo'yadi, bu yerda berilsa almashtiriladi -->
  <meta name="description" content="Rydex — do'kon, AI sotuvchi va kuryer xizmati bitta ilovada.">
  <meta name="theme-color" content="#FFFDF5">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rydex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rydex</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; background: #FFFDF5; }
    /* Flutter to'plami yuklanguncha ko'rinadigan brend ekrani — aks holda
       bir necha soniya bo'sh sahifa turadi va ilova buzuqdek ko'rinadi.
       Ranglar ilova ichidagi splash bilan bir xil: iliq oq + sariq nur. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #FFFDF5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    /* Burchaklardagi yumshoq sariq nur */
    #boot::before, #boot::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    }
    #boot::before {
      width: 420px; height: 420px; top: -140px; left: -100px;
      background: radial-gradient(circle, rgba(254,221,6,.45), rgba(254,221,6,0) 70%);
    }
    #boot::after {
      width: 400px; height: 400px; bottom: -160px; right: -120px;
      background: radial-gradient(circle, rgba(255,138,0,.16), rgba(255,138,0,0) 70%);
    }
    /* Logo va uning atrofida aylanuvchi sariq yoy (ilovadagi loader bilan bir xil) */
    #boot .mark { position: relative; width: 148px; height: 148px; animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both; }
    #boot .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid rgba(254,221,6,.16);
      border-top-color: #FEDD06;
      animation: spin 1.5s linear infinite;
    }
    #boot img { position: absolute; inset: 25px; width: 98px; height: 98px; }
    #boot .name { position: relative; color: #14161A; font-size: 25px; font-weight: 800; letter-spacing: -.6px; }
    #boot .sub { position: relative; color: rgba(20,22,26,.55); font-size: 13px; font-weight: 600; margin-top: -14px; }
    #boot .hint {
      position: relative; color: rgba(20,22,26,.4); font-size: 12px; font-weight: 800;
      letter-spacing: 1.2px; text-transform: uppercase; animation: fade 1.6s ease-in-out infinite;
    }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .mark, #boot .ring, #boot .hint { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">
      <div class="ring"></div>
      <img src="icons/Icon-512.png" alt="Rydex">
    </div>
    <div class="name">Rydex</div>
    <div class="sub">Do'kon va AI sotuvchi</div>
    <div class="hint">Yuklanmoqda</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter birinchi kadrni chizgach brend ekrani yumshoq so'nadi
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
</body>
</html>

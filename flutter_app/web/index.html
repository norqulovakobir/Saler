<!DOCTYPE html>
<html lang="uz">
<head>
  <!-- Bazaviy yo'l: `flutter build web --base-href` qiymati bilan almashtiriladi (Render'da ildiz "/") -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Saler AI — do'konlar, mahsulotlar va AI sotuvchi yordamchisi">
  <meta name="theme-color" content="#111111">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saler AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saler AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #111111; }
    /* Flutter yuklanguncha yuklanish belgisi */
    #loader { position: fixed; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; background: #111111; pointer-events: none; }
    #loader div { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #F5C400; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader"><div></div></div>
  <script>
    // Flutter birinchi kadrni chizganda yuklanish belgisini olib tashlaymiz
    function hideLoader() { var l = document.getElementById('loader'); if (l) l.remove(); }
    window.addEventListener('flutter-first-frame', hideLoader);
    // Ehtiyot: hodisa kelmasa ham belgi ilovani to'sib qolmasin
    setTimeout(hideLoader, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

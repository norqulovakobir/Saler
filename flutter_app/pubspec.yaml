name: saler_ai
description: Saler AI — do'kon va AI sotuvchi mobil ilovasi (Telegram botning Flutter versiyasi).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/cat/
  # Manrope shrifti ilova ichida (internetsiz ham bir xil ko'rinadi)
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# APK Release: `v*` tegi push qilinganda Android APK'lar yig'iladi va
# GitHub Release sifatida chiqariladi. Shaxsiy token kerak emas — Actions
# o'zining GITHUB_TOKEN'idan foydalanadi.
#
#   git tag v1.0.0 && git push origin v1.0.0
name: APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Release imzosi: kalit repo Secrets'ida saqlanadi. Bo'lmasa build
      # debug kalit bilan imzolanadi — bunday APK'ni Play Store qabul qilmaydi
      # va u lokal imzolangan versiya ustiga o'rnatilmaydi.
      - name: Imzo kalitini tayyorlash
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/rydex-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=rydex\nstoreFile=rydex-release.jks\n' \
            "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties

      # API manzili lib/config.dart dagi prodApiBase dan olinadi
      # (Cloudflare Worker). Alohida env kerak emas.
      - name: APK (har bir ABI uchun alohida)
        run: flutter build apk --release --split-per-abi

      - name: APK (universal)
        run: flutter build apk --release

      - name: Fayllarni nomlash
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Rydex-universal.apk
          mv app-arm64-v8a-release.apk Rydex-arm64.apk
          mv app-armeabi-v7a-release.apk Rydex-arm32.apk
          mv app-x86_64-release.apk Rydex-x86_64.apk
          ls -lh Rydex-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: Rydex ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Rydex Android ilovasi**

            Qaysi faylni yuklash kerak:
            - `Rydex-arm64.apk` — zamonaviy telefonlar (tavsiya etiladi)
            - `Rydex-arm32.apk` — eski telefonlar
            - `Rydex-universal.apk` — qaysi biri ekani noma'lum bo'lsa
            - `Rydex-x86_64.apk` — emulyator

            Backend: Cloudflare Worker (D1 + R2 + Brevo).
          files: flutter_app/build/app/outputs/flutter-apk/Rydex-*.apk

# Render Blueprint: Dashboard -> New -> Blueprint -> shu repo
# Baza va rasmlar Supabase'da (deploy/supabase/README.md). Render'da server, admin panel va Flutter web ilova ishlaydi.
services:
  - type: web
    name: saler-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Supabase -> Connect -> Session pooler manzili
      - key: DATABASE_URL
        sync: false
      # Supabase -> Project Settings -> Data API -> Project URL
      - key: SUPABASE_URL
        sync: false
      # Supabase -> Project Settings -> API Keys -> Secret key (sb_secret_...)
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # Groq kaliti (console.groq.com/keys): chatlar, AI yordamchi, sotuvchi maslahatlari
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      # Production: tasdiqlash kodi hech qachon javobda qaytmaydi
      - key: NODE_ENV
        value: production
      # EmailJS: ro'yxatdan o'tish va buyurtmada 6 xonali kod
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false

  - type: web
    name: saler-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Backend: Cloudflare Worker (D1 + R2 + Brevo)
      - key: NEXT_PUBLIC_API_URL
        value: https://saler-api.akobirnorqulov104.workers.dev

  # Flutter ilovasining web versiyasi (Static Site). Build ~5-8 daqiqa: Flutter SDK render-build.sh orqali yuklanadi.
  - type: web
    name: saler-web
    runtime: static
    rootDir: flutter_app
    buildCommand: ./render-build.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /canvaskit/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Backend: Cloudflare Worker (D1 + R2 + Brevo). Eski `saler-server` emas.
      - key: API_BASE
        value: https://saler-api.akobirnorqulov104.workers.dev
      # Worker uzoq SSE oqimini ushlab turolmaydi — davriy yangilanish ishlatiladi
      - key: REALTIME_ENABLED
        value: "false"
      - key: BOT_USERNAME
        value: saler_ai_bot

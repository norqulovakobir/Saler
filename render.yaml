# Render Blueprint: Dashboard -> New -> Blueprint -> shu repo
# Baza va rasmlar Supabase'da (deploy/supabase/README.md). Render'da faqat server va admin panel ishlaydi.
services:
  - type: web
    name: saler-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Supabase -> Connect -> Session pooler manzili
      - key: DATABASE_URL
        sync: false
      # Supabase -> Project Settings -> Data API -> Project URL
      - key: SUPABASE_URL
        sync: false
      # Supabase -> Project Settings -> API Keys -> Secret key (sb_secret_...)
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # Google AI Studio kaliti: chatlar, AI yordamchi, sotuvchi maslahatlari
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Production: tasdiqlash kodi hech qachon javobda qaytmaydi
      - key: NODE_ENV
        value: production
      # EmailJS: ro'yxatdan o'tish va buyurtmada 6 xonali kod
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false

  - type: web
    name: saler-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://saler-server.onrender.com

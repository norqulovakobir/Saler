# Render Blueprint: Dashboard -> New -> Blueprint -> shu repo
databases:
  - name: saler-db
    plan: free
    databaseName: saler
    user: saler

services:
  - type: web
    name: saler-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: saler-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5

  - type: web
    name: saler-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://saler-server.onrender.com

# Render Blueprint: Dashboard -> New -> Blueprint -> shu repo
# Backend Render'da emas: u Cloudflare Worker (D1 + R2 + Brevo), cloudflare-worker/ papkasida.
# Render faqat ikki statik/Next yuzani ko'taradi va ikkalasi ham Worker'ga ulanadi.
services:
  - type: web
    name: saler-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Backend: Cloudflare Worker (D1 + R2 + Brevo)
      - key: NEXT_PUBLIC_API_URL
        value: https://saler-api.akobirnorqulov104.workers.dev

  # Flutter ilovasining web versiyasi (Static Site). Build ~5-8 daqiqa: Flutter SDK render-build.sh orqali yuklanadi.
  - type: web
    name: saler-web
    runtime: static
    rootDir: flutter_app
    buildCommand: ./render-build.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /canvaskit/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Backend: Cloudflare Worker (D1 + R2 + Brevo)
      - key: API_BASE
        value: https://saler-api.akobirnorqulov104.workers.dev
      # Worker uzoq SSE oqimini ushlab turolmaydi — davriy yangilanish ishlatiladi
      - key: REALTIME_ENABLED
        value: "false"
      - key: BOT_USERNAME
        value: saler_ai_bot
